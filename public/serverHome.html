<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Draft Control 0.10.0</title>
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- JS custom -->
    <script src="resources/js/custom/app.js"></script>
    <script src="resources/js/custom/serverSocketHome.js"></script>
    <script src="resources/js/custom/serverHome.js"></script>

    <!-- CSS -->
    <link href="resources/css/custom/clearfix.css" rel="stylesheet" />
    <link href="/vendor/normalize/normalize.css" rel="stylesheet" />
    <link href="resources/css/custom/index.css" rel="stylesheet" />
    <link href="resources/css/custom/server.css" rel="stylesheet" />

    <meta
      content="Create a new draft or load a previous one in Draft Control."
      name="description"
    />

    <!-- Open Graph (link previews) -->
    <meta content="Draft Control" property="og:title" />
    <meta content="website" property="og:type" />
    <meta content="/server" property="og:url" />
    <meta content="/resources/images/og-image.png" property="og:image" />
  </head>

  <body>
    <h1>Draft Control 0.10.0</h1>
    <br />

    <div id="draft-name" class="page centered">
      <input aria-label="Draft name" placeholder="Insert draft name" />
      <button id="submit-draft-name" type="button" class="button">Create New</button>
    </div>

    <div id="draft-load" class="page centered">
      <select class="draft" aria-label="Saved drafts"></select>
      <button id="load" type="button" class="button" href="#">Load</button>
    </div>
  </body>
</html>
