<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Draft Control 0.10.0</title>
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- JS libraries -->
    <script src="/vendor/noty/noty.min.js"></script>

    <!-- JS custom -->
    <script src="resources/js/custom/app.js"></script>
    <script src="resources/js/custom/serverSocket.js"></script>
    <script src="resources/js/custom/server.js"></script>

    <!-- CSS (same order as before: Noty styles load last) -->
    <link href="resources/css/custom/clearfix.css" rel="stylesheet" />
    <link href="/vendor/normalize/normalize.css" rel="stylesheet" />
    <link href="resources/css/custom/index.css" rel="stylesheet" />
    <link href="resources/css/custom/server.css" rel="stylesheet" />
    <link href="/vendor/noty/themes/metroui.css" rel="stylesheet" />
    <link href="/vendor/noty/noty.css" rel="stylesheet" />

    <meta
      content="Manage a Draft Control draft: players, draft timer and tournament table."
      name="description"
    />

    <!-- Open Graph (link previews) -->
    <meta content="Draft Control" property="og:title" />
    <meta content="website" property="og:type" />
    <meta content="/server" property="og:url" />
    <meta content="/resources/images/og-image.png" property="og:image" />
  </head>

  <body>
    <span id="logo">Draft Control 0.10.0</span>

    <h1>Draft Control 0.10.0</h1>
    <h2 class="hidden">--/--/----</h2>

    <div id="draft-name" class="page centered hidden">
      <p>Insert draft name</p>
      <input aria-label="Draft name" />
      <button id="submit-draft-name" type="button" class="button">Ok</button>
    </div>

    <div id="player-names" class="page centered hidden">
      <p>Insert players (Focus out or press enter to add another field)</p>

      <div id="player-inputs"></div>

      <button id="submit-player-names" type="button" class="button">Build table</button>
      <button id="enter-draft-timer" type="button" class="button">Draft timer</button>
    </div>

    <div id="tournament-table" class="page hidden">
      <div id="suggested-matches">
        <span>Suggested matches:</span>
      </div>
      <div id="tables"></div>
    </div>

    <div id="draft-timer" class="page centered hidden">
      <div id="draft-timer-settings">
        <label>
          <span>Number of rounds</span>
          <input id="round-number" placeholder="Input the number of rounds" />
        </label>
        <button id="init-timer" type="button" class="button" href="#">Set</button>
      </div>

      <div id="draft-timer-places">
        <span>Draft places order:</span>
      </div>

      <div id="draft-timer-runner">
        <p>Rounds left: <span id="rounds-left-timer"></span></p>
        <p>Orientation: <span id="rounds-orientation"></span></p>
        <div id="clock"></div>
        <div id="timer-buttons">
          <button id="start-timer" type="button" class="button">Start</button>
          <button id="restart-timer" type="button" class="hidden button">Restart</button>
        </div>
      </div>

      <div id="draft-finished">
        <p>Draft round should be finished by now</p>
        <button id="new-draft-round" type="button" class="button">New Round</button>
        <button id="return-home" type="button" class="button">Player List</button>
      </div>
    </div>

    <div id="buttons">
      <button id="tournament-table-menu-btn" data-page="tournament-table" type="button" class="button" href="#">Menu</button>
      <button id="home" type="button" class="button" href="#">Home</button>
    </div>

    <audio id="alarm-clock-sound" src="resources/sounds/alarmclock.ogg" />
    <audio id="hi-beep-sound" src="resources/sounds/hi-beep.mp3" />
    <audio id="lo-beep-sound" src="resources/sounds/lo-beep.mp3" />
    <audio id="chime-sound" src="resources/sounds/chime.mp3" />
  </body>
</html>
