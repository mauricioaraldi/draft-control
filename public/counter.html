<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
      name="viewport"
    />
    <title>Draft Control 0.10.0</title>
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- JS custom -->
    <script src="resources/js/custom/app.js"></script>
    <script src="resources/js/custom/counter.js"></script>
    <script src="resources/js/custom/counterSocket.js"></script>

    <!-- CSS -->
    <link href="resources/css/custom/clearfix.css" rel="stylesheet" />
    <link href="/vendor/normalize/normalize.css" rel="stylesheet" />
    <link href="resources/css/custom/index.css" rel="stylesheet" />
    <link href="resources/css/custom/counter.css" rel="stylesheet" />

    <meta content="Life counter for Draft Control games." name="description" />
    <meta content="telephone=no" name="format-detection" />
    <meta content="no" name="msapplication-tap-highlight" />

    <!-- Open Graph (link previews) -->
    <meta content="Draft Control" property="og:title" />
    <meta content="website" property="og:type" />
    <meta content="/" property="og:url" />
    <meta content="/resources/images/og-image.png" property="og:image" />
  </head>

  <body>
    <header>
      <h1 id="draftName">Draft Name</h1>
      <button id="openMenu" type="button" aria-label="Menu" title="Menu">M</button>
      <button id="openDieMenu" type="button" aria-label="Roll a die" title="Roll a die">D</button>
    </header>

    <div id="menu">
      <button id="endGame" type="button" class="button">End game</button>
      <button id="reset" type="button" class="button">Reset</button>
      <button id="closeMenu" type="button" class="button">Close</button>
    </div>

    <div id="dieMenu">
      <h2>Sides</h2>
      <button type="button" class="button">10</button>
      <button type="button" class="button">20</button>
    </div>

    <div id="NoGame">
      <h2>No games currently available. Please create or load a game from the server menu.</h2>
    </div>

    <div id="whoWonMenu">
      <h2>Who won?</h2>
    </div>

    <div id="hpContainer">
      <span id="playerOneHp" class="hp" data-player-position="1">20</span>
      <span id="playerTwoHp" class="hp" data-player-position="2">20</span>
    </div>

    <div id="controlsContainer">
      <div id="playerOneControls" class="controls" data-player-position="1">
        <select class="name" aria-label="Player"></select>

        <div class="buttons">
          <button type="button" class="button">+1</button>
          <button type="button" class="button">+5</button>
          <button type="button" class="button">-1</button>
          <button type="button" class="button">-5</button>
        </div>

        <button type="button" class="button undo">Undo</button>
      </div>
      <div id="playerTwoControls" class="controls" data-player-position="2">
        <select class="name" aria-label="Player"></select>

        <div class="buttons">
          <button type="button" class="button">+1</button>
          <button type="button" class="button">+5</button>
          <button type="button" class="button">-1</button>
          <button type="button" class="button">-5</button>
        </div>

        <button type="button" class="button undo">Undo</button>
      </div>
    </div>

    <div id="historyContainer">
      <div
        id="playerOneHistory"
        class="history"
        data-delta="0"
        data-player-position="1"
        data-time="0"
      >
        <div></div>
      </div>
      <div
        id="playerTwoHistory"
        class="history"
        data-delta="0"
        data-player-position="2"
        data-time="0"
      >
        <div></div>
      </div>
    </div>
  </body>
</html>
